{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
  <section class="auth-panel">
    <h1>Sign in</h1>
    <form method="post" action="{{ url_for('login') }}" class="card form-grid">
      <label>
        <span>Username</span>
        <input type="text" name="username" required>
      </label>
      <label>
        <span>Password</span>
        <input type="password" name="password" required>
      </label>
      <button type="submit">Login</button>
    </form>

    <div class="divider">Create account</div>

    <form method="post" action="{{ url_for('register') }}" class="card form-grid">
      <label>
        <span>Username</span>
        <input type="text" name="username" required>
      </label>
      <label>
        <span>Email</span>
        <input type="email" name="email" required>
      </label>
      <label>
        <span>Password</span>
        <input type="password" name="password" required>
      </label>
      <label>
        <span>Account type</span>
        <select name="role">
          <option value="STUDENT">Student</option>
          <option value="TECHNICIAN">Technician</option>
        </select>
      </label>
      <button type="submit">Register</button>
    </form>
  </section>
{% endblock %}
