{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
  <section class="auth-panel">
    <h1>Sign in</h1>
    <form method="post" action="{{ url_for('login') }}" class="card form-grid" autocomplete="off" data-clear-on-load>
      <label>
        <span>Username</span>
        <input type="text" name="username" required>
      </label>
      <label>
        <span>Password</span>
        <span class="password-field">
          <input type="password" name="password" required>
          <button type="button" class="password-toggle" data-password-toggle aria-label="Show password" title="Show password">
            <svg class="eye-icon eye-icon-open" aria-hidden="true" viewBox="0 0 24 24" focusable="false">
              <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
              <circle cx="12" cy="12" r="2.5"></circle>
            </svg>
            <svg class="eye-icon eye-icon-closed" aria-hidden="true" viewBox="0 0 24 24" focusable="false">
              <path d="M3 12c2.3 2.7 5.3 4 9 4s6.7-1.3 9-4"></path>
              <path d="M5 8.5 3.5 7M9 7 8.5 5M15 7l.5-2M19 8.5 20.5 7"></path>
            </svg>
          </button>
        </span>
      </label>
      <button type="submit">Login</button>
    </form>
    <p class="auth-link">Need an account? <a href="{{ url_for('register') }}">Register here</a>.</p>
  </section>
{% endblock %}
