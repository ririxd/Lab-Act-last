{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
  <section class="auth-panel">
    <h1>Sign in</h1>
    <form method="post" action="{{ url_for('login') }}" class="card form-grid" autocomplete="off" data-clear-on-load>
      <label>
        <span>Username</span>
        <input type="text" name="username" required>
      </label>
      <label>
        <span>Password</span>
        <input type="password" name="password" required>
      </label>
      <button type="submit">Login</button>
    </form>
    <p class="auth-link">Need an account? <a href="{{ url_for('register') }}">Register here</a>.</p>
  </section>
{% endblock %}
